<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подготовка к СОР — тренажёр</title>
<style>
:root{
  --ink:#1F3A5A; --muted:#5F7089; --paper:#EEF4FA; --card:#FFFFFF; --line:#CFDDEC;
  --head:#DCEAF8; --accent:#2F6FD0; --accent-bg:#E4EEFC;
  --cpu:#2F6FD0; --cpu-bg:#E4EEFC;
  --mem:#16897A; --mem-bg:#DDF3EF;
  --dik:#5A55B0; --dik-bg:#ECEBFA;
  --fs:#B9781A; --fs-bg:#FBF0DA;
  --sum:#4F6B86; --sum-bg:#E6EDF4;
  --ok:#2C8F5B; --ok-bg:#E3F5EA;
  --bad:#D2741F; --bad-bg:#FDF0E2;
  --sea:#D7EBF7; --sea-line:#A9CBE3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:20px;line-height:1.45}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}

/* шапка */
header.top{background:var(--head);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:28px;line-height:1.2}
header.top .sub{color:var(--muted);font-size:17px}
.who{display:flex;flex-wrap:wrap;gap:10px}
.who label{display:flex;flex-direction:column;font-size:15px;color:var(--muted)}
.who input{border:2px solid var(--line);border-radius:8px;padding:7px 10px;font-size:19px;background:#fff;color:var(--ink)}
.who input#fio{width:250px}.who input#cls{width:90px}
.who input.need{border-color:var(--bad);background:var(--bad-bg)}

/* вкладки */
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
nav.tabs button{flex:1 1 150px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:18px;font-weight:bold;color:var(--ink)}
nav.tabs button svg{width:26px;height:26px;flex:none}
nav.tabs button .sc{font-weight:normal;font-size:14px;color:var(--muted)}
nav.tabs button[data-m=cpu].on{background:var(--cpu-bg);border-color:var(--cpu)}
nav.tabs button[data-m=mem].on{background:var(--mem-bg);border-color:var(--mem)}
nav.tabs button[data-m=dik].on{background:var(--dik-bg);border-color:var(--dik)}
nav.tabs button[data-m=fs].on{background:var(--fs-bg);border-color:var(--fs)}
nav.tabs button[data-m=sum].on{background:var(--sum-bg);border-color:var(--sum)}

.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.mhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h2{margin:0;font-size:24px}
.mhead .info{color:var(--muted);font-size:16px}
.sub-tabs{display:inline-flex;border:2px solid var(--fs);border-radius:10px;overflow:hidden}
.sub-tabs button{border:none;background:#fff;padding:8px 16px;cursor:pointer;font-size:17px}
.sub-tabs button.on{background:var(--fs);color:#fff}

/* прогресс */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dots span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);background:#fff}
.dots span.cur{border-color:var(--ink);color:var(--ink);font-weight:bold}
.dots span.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dots span.half{background:#FFF6D9;border-color:#C9A227;color:#8A6D10}
.dots span.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

.task .num{font-size:15px;color:var(--muted);margin-bottom:4px}
.task .q{font-size:22px;font-weight:bold;margin:0 0 12px}
.box{border:2px dashed var(--line);border-radius:10px;padding:12px 16px;margin:0 0 14px;background:#F8FBFE;font-size:21px}
.box.mono{font-size:19px;word-break:break-word}
.sit{border-left:5px solid var(--accent);background:var(--accent-bg);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.picone{display:block;max-width:280px;max-height:210px;margin:0 auto 14px;border-radius:10px;border:1px solid var(--line)}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:600px){.opts.two{grid-template-columns:1fr}}
.opt{text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:20px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt.mono{font-size:18px}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt.pic{text-align:center;padding:8px}
.opt.pic img{display:block;width:100%;height:130px;object-fit:contain;border-radius:6px}

/* соответствие */
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:12px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.mrow.pic{grid-template-columns:150px 1fr}
.mrow img{width:150px;height:105px;object-fit:contain;border-radius:6px}
.mrow select{width:100%;padding:8px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:18px}
.mrow.right{border-color:var(--ok);background:var(--ok-bg)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{grid-column:1/-1;font-size:16px;color:var(--bad)}

/* порядок */
.pool,.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border-radius:10px}
.pool{border:2px dashed var(--line)}
.seq{border:2px solid var(--accent);background:var(--accent-bg);margin-top:10px}
.seq:empty::before{content:"Сюда встанут выбранные ответы по порядку";color:var(--muted);font-size:16px;align-self:center}
.piece{padding:9px 14px;border:2px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:19px}
.piece:disabled{opacity:.35;cursor:default}
.seq .piece{border-color:var(--accent)}
.seq .piece b{color:var(--accent);margin-right:6px}
.olabel{font-size:15px;color:var(--muted);margin-top:8px}

/* выбор символа */
.namebar{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:6px 0 4px}
.ch{min-width:34px;height:46px;border:2px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:22px;font-family:"JetBrains Mono",Consolas,monospace}
.ch.sp{min-width:20px;border-style:dotted}
.ch.sel{border-color:var(--accent);background:var(--accent-bg)}
.ch.right{border-color:var(--ok);background:var(--ok-bg)}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg)}

.inp{width:100%;max-width:520px;padding:10px 12px;border:2px solid var(--line);border-radius:9px;font-size:20px}
.inp.right{border-color:var(--ok);background:var(--ok-bg)}.inp.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* дерево */
.tree{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#FBFDFF;margin-bottom:12px;font-size:19px}
.tree .r{display:flex;align-items:center;gap:8px;padding:2px 0}
.tree svg{width:24px;height:20px;flex:none}

.fb{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:19px}
.fb.ok{background:var(--ok-bg);border-left:6px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:6px solid var(--bad)}
.fb b.h{display:block;margin-bottom:2px}
.act{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{padding:11px 22px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:19px;cursor:pointer;font-weight:bold}
.btn:disabled{background:#B9CBE3;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.code{font-family:"JetBrains Mono",Consolas,monospace;background:#EEF3F9;border-radius:5px;padding:0 5px;font-size:.92em;white-space:nowrap}

/* итог модуля */
.final .big{font-size:34px;font-weight:bold;margin:2px 0}
.final .big small{font-size:20px;font-weight:normal;color:var(--muted)}
table.rep{width:100%;border-collapse:collapse;font-size:17px;margin-top:12px}
table.rep th,table.rep td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.rep th{background:var(--accent-bg)}
td.v-ok{color:var(--ok);font-weight:bold}td.v-bad{color:var(--bad);font-weight:bold}td.v-half{color:#8A6D10;font-weight:bold}
.start p{margin:0 0 10px}

/* морской бой */
.battle{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:820px){.battle{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr));gap:4px}
.grid .hd{display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;color:var(--muted)}
.cell{min-height:70px;border:2px solid var(--sea-line);border-radius:8px;background:var(--sea);cursor:pointer;padding:4px;font-size:15px;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;word-break:normal;overflow-wrap:break-word;hyphens:none;position:relative}
.cell.f{font-family:"JetBrains Mono",Consolas,monospace;font-size:13.5px}
.cell:hover:not(.done){border-color:var(--accent)}
.cell.sel{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-bg)}
.cell.hit{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.cell.hit::after{content:"";position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--ok)}
.cell.miss{background:#fff;border-color:var(--bad);border-style:dashed;cursor:default}
.cell.miss::after{content:"мимо";position:absolute;right:3px;top:1px;font-size:11px;color:var(--bad);font-family:"Times New Roman",serif}
.cell.lost{border-color:var(--ok);border-style:dashed;cursor:default}
.fleet{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px}
.fleet svg{width:32px;height:20px}
.battle .q{font-weight:bold;font-size:22px}
.shot{font-size:16px;color:var(--muted)}
.coord{display:flex;gap:8px;align-items:center;margin:10px 0}
.coord input{width:90px;text-align:center;font-size:24px;padding:6px;border:2px solid var(--line);border-radius:9px;text-transform:uppercase}
.legend{font-size:15px;color:var(--muted);margin-top:10px}

/* итоги */
table.sum{width:100%;border-collapse:collapse;font-size:18px}
table.sum th,table.sum td{border:1px solid var(--line);padding:9px 10px;text-align:left}
table.sum th{background:var(--sum-bg)}
.hint{font-size:16px;color:var(--muted)}
.hide{display:none!important}
details.help{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:14px}
details.help summary{cursor:pointer;padding:12px 18px;font-weight:bold;font-size:20px;list-style:none;display:flex;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"▸";font-size:18px;transition:transform .15s}
details.help[open] summary::before{transform:rotate(90deg)}
details.help summary .hs{font-weight:normal;font-size:16px;color:var(--muted)}
details.help .hb{padding:0 20px 16px;font-size:19px}
details.help .hb h4{margin:14px 0 6px;font-size:19px}
details.help .hb p{margin:6px 0}
details.help .hb ul{margin:4px 0;padding-left:22px}
details.help table{border-collapse:collapse;width:100%;font-size:17px;margin:6px 0}
details.help th,details.help td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
details.help th{background:#F2F6FB}
.tbl{overflow-x:auto}
.kw{font-weight:bold}
.dk-d{color:#2F6FA8}.dk-i{color:#13838F}.dk-k{color:#5A4FB0}
.dk{display:grid;gap:8px;margin:6px 0}
.dkc{border-radius:10px;padding:10px 14px;border-left:6px solid}
.dkc.d{background:#E7F0F9;border-color:#2F6FA8}.dkc.i{background:#E0F3F4;border-color:#13838F}.dkc.k{background:#ECEAF8;border-color:#5A4FB0}
.dkc .ex{font-size:17px;color:var(--muted);margin-top:4px}
.tip{background:#FFF7DD;border-left:5px solid #DDB443;border-radius:8px;padding:8px 14px;margin:0 0 14px;font-size:18px}
.nm{font-weight:bold;color:#A1620A}
.msg{font-size:20px;margin:8px 0 0}
@media (max-width:600px){
  body{font-size:18px}
  .wrap{padding:10px 10px 40px}
  header.top{padding:12px 14px}
  header.top h1{font-size:24px}
  .who{width:100%}.who label{flex:1}.who input#fio{width:100%}.who input#cls{width:80px}
  nav.tabs button{flex:1 1 44%;font-size:16px;padding:9px 6px}
  .card{padding:14px}
  .task .q{font-size:20px}
  .opt{font-size:18px;padding:10px 12px}
  .mrow{grid-template-columns:1fr}
  .mrow.pic{grid-template-columns:100px 1fr}
  .mrow img{width:100px;height:75px}
  .grid{grid-template-columns:20px repeat(5,minmax(0,1fr));gap:3px}
  .cell{min-height:58px;font-size:12px;padding:2px}
  .cell.f{font-size:10.5px}
  .box{font-size:18px}.box.mono{font-size:15px}
  details.help .hb{padding:0 12px 12px;font-size:17px}
  details.help summary .hs{display:none}
  .cell:not(.f){overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto;font-size:11px}
  table.sum{font-size:16px}table.sum th,table.sum td{padding:6px}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Подготовка к СОР</h1>
      <div class="sub">Данные, информация, знания · Процессор · Память · Файлы и ПО</div>
    </div>
    <div class="who">
      <label>Фамилия, имя<input id="fio" type="text" autocomplete="off" spellcheck="false" maxlength="60"></label>
      <label>Класс<input id="cls" type="text" autocomplete="off" spellcheck="false" maxlength="6"></label>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-m="dik"><svg><use href="#i-dik"/></svg><span>Данные, информация, знания <span class="sc" id="sc-dik"></span></span></button>
    <button type="button" data-m="cpu"><svg><use href="#i-cpu"/></svg><span>Процессор <span class="sc" id="sc-cpu"></span></span></button>
    <button type="button" data-m="mem"><svg><use href="#i-mem"/></svg><span>Память <span class="sc" id="sc-mem"></span></span></button>
    <button type="button" data-m="fs"><svg><use href="#i-fs"/></svg><span>Файлы и ПО <span class="sc" id="sc-fs"></span></span></button>
    <button type="button" data-m="sum"><svg><use href="#i-sum"/></svg><span>Мои итоги</span></button>
  </nav>

  <section class="panel" id="p-dik"><div id="h-dik"></div><div id="b-dik"></div></section>
  <section class="panel" id="p-cpu"><div id="h-cpu"></div><div id="b-cpu"></div></section>
  <section class="panel" id="p-mem"><div id="h-mem"></div><div id="b-mem"></div></section>
  <section class="panel" id="p-fs">
    <div class="card" style="padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
      <b style="font-size:22px">Файлы и программное обеспечение</b>
      <div class="sub-tabs"><button type="button" id="fsT" class="on">Задания</button><button type="button" id="fsB">Морской бой</button></div>
    </div>
    <div id="h-fs"></div>
    <div id="p-fsq"></div>
    <div id="p-sea" class="hide"></div>
  </section>
  <section class="panel" id="p-sum"></section>
</div>

<script>

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, k) => shuffle(a).slice(0, k);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const plain = h => String(h).replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
const C = s => '<span class="code">' + esc(s) + '</span>';
const ico = id => '<svg><use href="#' + id + '"/></svg>';
const dec = s => String(s).replace('.', ',');
function plural(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10; if(a > 10 && a < 20) return many; if(b === 1) return one; if(b >= 2 && b <= 4) return few; return many; }
const cores = n => n + ' ' + plural(n, 'ядро', 'ядра', 'ядер');
function uniqPick(pool, used, key){ let x, t = 0; do { x = pick(pool); t++; } while(used.has(key(x)) && t < 200); used.add(key(x)); return x; }
function distinct(arr){ return [...new Set(arr)]; }
const cap = t => t && t[0] !== '<' ? t.charAt(0).toUpperCase() + t.slice(1) : t;

/* --- конструкторы заданий --- */
function choice(q, opts, explain, o){ o = o || {}; return {type:'choice', q, extra:o.extra || '', opts:(o.keep ? opts : shuffle(opts)).map(x => ({t:x[0], ok:!!x[1], img:x[2] || ''})), explain, mono:!!o.mono, two:!!o.two, pics:!!o.pics}; }
function multi(q, opts, explain, o){ o = o || {}; return {type:'multi', q, extra:o.extra || '', opts:shuffle(opts).map(x => ({t:x[0], ok:!!x[1]})), explain, mono:!!o.mono}; }
function input(q, check, o){ return {type:'input', q, check, extra:o.extra || '', placeholder:o.placeholder || '', answer:o.answer, explain:o.explain || ''}; }
/* rows: [левая часть (html), верный ответ]; choices — список ответов для выпадающего списка */
function match(q, rows, choices, explain, o){ o = o || {}; return {type:'match', q, extra:o.extra || '', rows:shuffle(rows).map(r => ({l:cap(r[0]), r:cap(r[1]), img:r[2] || ''})), choices:(o.keepChoices ? choices : shuffle(choices)).map(cap), explain, pic:!!o.pic}; }
function order(q, right, explain, o){ o = o || {}; return {type:'order', q, extra:o.extra || '', pieces:shuffle(right.concat(o.extraPieces || [])), right, explain, sep:o.sep || ' → ', mono:!!o.mono}; }

function check(m){
  const s = ST[m]; if(s.checked) return; const t = s.tasks[s.i], box = document.getElementById('body-' + m);
  const r = CHECK[t.type](m, t, box); s.checked = true;
  s.rec[s.i] = {q:plain(t.q) + (t.extra && !/tree|<img/.test(t.extra) ? ' ' + plain(t.extra.replace(/<div class="tip">[\s\S]*?<\/div>/g, '')).slice(0, 200) : ''), score:r.score, given:r.given, right:r.right};
  const fb = document.getElementById('fb-' + m), full = r.score >= 1;
  let html = '<div class="fb ' + (full ? 'ok' : 'bad') + '"><b class="h">' + (full ? 'Верно!' : r.score > 0 ? 'Частично верно: ' + Math.round(r.score * 100) + '%' : 'Не совсем.') + '</b>';
  if(r.msg && !full) html += r.msg + '<br>';
  if(!full && (t.type === 'choice' || t.type === 'input')) html += 'Правильный ответ: <b>' + esc(r.right) + '</b>. ';
  if(!full && t.type === 'order') html += 'Правильный порядок: <b>' + esc(r.right) + '</b>. ';
  html += (t.explain || '') + '</div>';
  fb.innerHTML = html;
  document.getElementById('chk-' + m).classList.add('hide');
  const n = document.getElementById('nxt-' + m); n.classList.remove('hide'); n.focus();
  updateDots(m);
}
function updateDots(m){ const s = ST[m], d = document.querySelectorAll('#' + MODS[m].el + ' .dots span'); const r = s.rec[s.i]; if(d[s.i]) d[s.i].className = r.score >= 1 ? 'ok' : r.score > 0 ? 'half' : 'bad';
  const info = document.querySelector('#' + MODS[m].el + ' .mhead .info'); if(info) info.textContent = 'Верно: ' + fmtScore(s.rec.reduce((a, r) => a + r.score, 0)) + ' из ' + s.rec.length; }

const SEA_N = 8;
function seaGen(){
  for(let tries = 0; tries < 500; tries++){
    const progK = ['os','drv','util','dev','brw','msg','txtapp','game','paint','calc','presapp','tabapp'], fileK = ['text','pres','tab','pdf','img','snd','vid','zip','exe','bad'];
    const asked = shuffle(sample(progK, 3).concat(sample(fileK, 5)));
    const ans = []; let fail = false;
    for(const k of asked){ const cand = SEA_ITEMS.filter(it => it[1].includes(k) && it[1].every(x => x === k || !asked.includes(x)));
      if(!cand.length){ fail = true; break; } ans.push(pick(cand)); }
    if(fail) continue;
    const fill = shuffle(SEA_ITEMS.filter(it => !ans.includes(it) && it[1].every(x => !asked.includes(x))));
    if(fill.length < 25 - SEA_N) continue;
    const cells = shuffle(ans.concat(fill.slice(0, 25 - SEA_N))).map(it => ({t:it[0], f:!!it[2], kinds:it[1], st:''}));
    const qs = asked.map((k, n) => ({k, idx:cells.findIndex(c => c.t === ans[n][0])}));
    if(qs.every(q => cells.filter(c => c.kinds.includes(q.k)).length === 1)) return {cells, qs, i:0, hits:0, shot:false, sel:null, rec:[], finished:false};
  }
}

  const L = /[АБВГД]/.test(m[1]) ? m[1] : m[2], N = /[1-5]/.test(m[1]) ? m[1] : m[2]; return (+N - 1) * 5 + COLS.indexOf(L); }

function fire(){ const S = SEA, q = S.qs[S.i], inp = document.getElementById('seaIn');

const MAIN = ['dik','cpu','mem','fs'];

/* итоговая оценка: среднее лучших результатов по четырём разделам; морской бой — дополнительная игра, в итог не входит */
function finalGrade(){ const done = MAIN.filter(m => RES[m].length); if(!done.length) return null;
  const avg = done.reduce((a, m) => a + bestOf(m), 0) / done.length;
  return {ball:Math.round(avg), avg, done:done.length, all:done.length === MAIN.length, left:MAIN.filter(m => !RES[m].length)}; }
function updateTabScores(){ MAIN.forEach(m => { const last = RES[m].length ? RES[m][RES[m].length - 1] : null;

<li>Это сообщение об одном конкретном факте? <b>Да</b> → <span class="kw dk-i">информация</span>.</li>
<li>Это общее правило или вывод, который помогает решить, что делать? <b>Да</b> → <span class="kw dk-k">знания</span>.</li></ul>
<h4>А при чём тут ИИ?</h4>
<p>Тысячи фотографий для обучения — это <span class="kw dk-d">данные</span>. Подпись «на фото — яблоко» — <span class="kw dk-i">информация</span>. Модель, которая научилась сама отличать яблоко от апельсина, — это её <span class="kw dk-k">«знания»</span>.</p>`,
cpu:`<p><b>Процессор (CPU)</b> — центральное устройство компьютера, его «мозг». Он <b>обрабатывает информацию</b> (выполняет арифметические и логические операции по программе) и <b>управляет работой всех устройств</b>. Находится на материнской плате в системном блоке.</p>
<h4>Характеристики процессора</h4>
<table><tr><th>Характеристика</th><th>Что это</th></tr>
<tr><td>Тактовая частота</td><td>Число тактов в секунду. <b>Такт</b> — время выполнения простейшей операции. Измеряют в гигагерцах: 3 ГГц = 3 миллиарда тактов в секунду.</td></tr>
<tr><td>Разрядность</td><td>Сколько бит процессор обрабатывает за один такт: 32, 64.</td></tr>
<tr><td>Кэш-память</td><td>Сверхбыстрая память процессора небольшого объёма.</td></tr>
<tr><td>Количество ядер</td><td>Многоядерный процессор — несколько процессоров (ядер) в одном. Dual-core — 2 ядра, Quad — 4, Hexa — 6, Octa — 8, Deca — 10.</td></tr></table>
<p>Чем <b>выше</b> частота, чем <b>больше</b> ядер, кэш-память и разрядность — тем быстрее процессор.</p>
<h4>Из чего состоит процессор</h4>
<ul><li><b>АЛУ</b> (арифметико-логическое устройство) — выполняет математические и логические операции.</li>
<li><b>УУ</b> (устройство управления) — следит за порядком выполнения команд.</li>
<li><b>Регистры</b> — ячейки памяти внутри процессора.</li>
<li><b>Кэш-память</b> — быстрая память для временного хранения данных.</li></ul>
<h4>Как читать описание процессора в магазине</h4>
<div class="box mono" style="font-size:16px">Intel Core i5-12400 (6C/12T, 18M Cache, 2.5 up to 4.4GHz)</div>
<ul><li><span class="code">6C</span> — 6 ядер (C — cores, ядра)</li><li><span class="code">12T</span> — потоки, сейчас их не учитываем</li><li><span class="code">18M Cache</span> — кэш-память 18 МБ</li><li><span class="code">2.5 up to 4.4GHz</span> — частота от 2,5 ГГц (обычная) до 4,4 ГГц (максимальная)</li></ul>`,
mem:`<div class="tbl"><table><tr><th>Память</th><th>Что в ней</th><th>При выключении</th><th>Где находится</th></tr>
<tr><td><b>Кэш-память</b></td><td>Данные, которые процессору нужны чаще всего. Самая быстрая, объём маленький.</td><td>Стирается</td><td>Внутри процессора</td></tr>
<tr><td><b>ОЗУ</b> — оперативная (RAM)</td><td>Программы, которые запущены сейчас, и открытые документы.</td><td>Стирается</td><td>Модули на материнской плате</td></tr>
<tr><td><b>ПЗУ</b> — постоянная (ROM)</td><td>Программа самотестирования. Только для чтения, записывают на заводе.</td><td>Сохраняется</td><td>Микросхема на материнской плате</td></tr>
<tr><td><b>Жёсткий диск (HDD)</b></td><td>Все программы и файлы. Механический: внутри вращаются пластины.</td><td>Сохраняется</td><td>В системном блоке</td></tr>
<tr><td><b>SSD</b></td><td>То же, что на HDD, но без движущихся частей, работает быстрее.</td><td>Сохраняется</td><td>В системном блоке, в ноутбуке</td></tr>
<tr><td><b>Флешка</b></td><td>Файлы, чтобы перенести их на другой компьютер.</td><td>Сохраняется</td><td>Подключается к USB-порту</td></tr>
<tr><td><b>Оптические диски</b></td><td>CD — около 700 МБ, DVD — до 9,4 ГБ, Blu-ray — до 100 ГБ. Читают лазером.</td><td>Сохраняется</td><td>Вставляют в дисковод</td></tr></table></div>
<p><b>Энергозависимая</b> память (стирается без электричества): кэш, ОЗУ, регистры. Остальная — <b>энергонезависимая</b>.</p>
<p><b>По скорости</b> (от быстрой к медленной): кэш → ОЗУ → SSD → жёсткий диск → оптический диск.</p>
<p><b>По объёму</b> (обычно): кэш &lt; ОЗУ &lt; жёсткий диск. 1 ГБ = 1024 МБ, 1 ТБ = 1024 ГБ.</p>
<p><b>Буквы на дисках:</b> ROM — только чтение, R — записать один раз, RW — записывать много раз.</p>
<h4>Память и операционная система</h4>
<ul><li>Запускаешь программу → ОС загружает её с диска в ОЗУ (управление программами).</li>
<li>Нажимаешь «Сохранить» → ОС записывает файл на жёсткий диск (управление файлами).</li>
<li>Вставляешь флешку → ОС её «видит» (управление устройствами).</li>
<li>Не сохранил документ и отключили свет → текст пропал: он был только в ОЗУ.</li></ul>`,
fs:`<h4>Виды программного обеспечения</h4>
<ul><li><b>Системное ПО</b> управляет самим устройством: операционные системы, драйверы, антивирус, архиватор и др.</li>
<li><b>Прикладное ПО</b> помогает человеку решать его задачи: Word, Paint, PowerPoint, Excel, браузер, мессенджеры, игры и др.</li>
<li><b>Системы программирования</b> — для создания программ: Scratch, Python и др.</li></ul>
<h4>Операционная система (ОС)</h4>
<p>Главная программа: Windows, macOS, Linux — на компьютерах; Android, iOS — на телефонах. Все остальные программы работают под её управлением.</p>
<table><tr><th>Функция ОС</th><th>Пример</th></tr>
<tr><td>Управление устройствами</td><td>Подключил наушники — звук пошёл через них</td></tr>
<tr><td>Управление программами</td><td>Запустил игру, закрыл «зависшую» программу</td></tr>
<tr><td>Управление файлами</td><td>Создал папку, переименовал, скопировал, удалил файл</td></tr>
<tr><td>Диалог с пользователем</td><td>Окна, значки, меню, уведомления (интерфейс)</td></tr></table>
<h4>Имя файла</h4>
<p><span class="code">Доклад о космосе.docx</span> — имя, точка, расширение. Расширение — то, что стоит <b>после последней точки</b>; оно показывает тип файла. В имени до 255 символов, запрещены 9 символов: <span class="code">/ \\ : * ? " &lt; &gt; |</span></p>
<div class="tbl"><table><tr><th>Тип файла</th><th>Расширения</th></tr>
<tr><td>Текстовый документ</td><td>.docx .txt</td></tr><tr><td>Презентация</td><td>.pptx</td></tr><tr><td>Таблица (Excel)</td><td>.xlsx</td></tr><tr><td>PDF — документ для чтения и печати</td><td>.pdf</td></tr>
<tr><td>Изображение</td><td>.jpg .png</td></tr><tr><td>Звук</td><td>.mp3</td></tr><tr><td>Видео</td><td>.mp4</td></tr><tr><td>Архив</td><td>.zip</td></tr><tr><td>Программа</td><td>.exe</td></tr></table></div>
<h4>Папки и путь</h4>
<p><b>Путь</b> — адрес файла: диск и все папки по порядку, разделитель <span class="code">\\</span>. Например: <span class="code">C:\\Школа\\История\\Доклад.docx</span></p>
<ul><li>В одной папке не может быть двух файлов с одинаковым именем, в разных — может.</li>
<li><b>Копирование</b>: файл остаётся на старом месте и появляется в новом. <b>Перемещение</b>: файл есть только на новом месте.</li>
<li><b>Ярлык</b> — указатель на файл или программу (значок со стрелкой). Удалишь ярлык — сам файл останется.</li></ul>`
};
function renderHelp(){ ['dik','cpu','mem','fs'].forEach(m => {
  document.getElementById('h-' + m).innerHTML = '<details class="help"' + (m === 'dik' ? ' open' : '') + '><summary>📖 Краткая справка <span class="hs">— нажми, чтобы открыть или закрыть</span></summary><div class="hb">' + HELP[m] + '</div></details>'; }); }

/* ===================== ВКЛАДКИ ===================== */
function show(m){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + m));
  if(m === 'sum') renderSum();
  else if(m === 'fs'){ if(!document.getElementById('p-fsq').innerHTML) renderMod('fs'); if(!document.getElementById('p-sea').innerHTML) renderSea(); }
  else if(!document.getElementById(MODS[m].el).innerHTML) renderMod(m);
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => show(b.dataset.m));
document.getElementById('fsT').onclick = () => { fsT.classList.add('on'); fsB.classList.remove('on'); document.getElementById('p-fsq').classList.remove('hide'); document.getElementById('p-sea').classList.add('hide'); };
document.getElementById('fsB').onclick = () => { fsB.classList.add('on'); fsT.classList.remove('on'); document.getElementById('p-sea').classList.remove('hide'); document.getElementById('p-fsq').classList.add('hide'); };
renderHelp();
show('dik');
</script>
</body>
</html>
